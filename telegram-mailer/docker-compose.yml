services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: telegram-mailer-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - mailer-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: telegram-mailer-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - mailer-network

  # Database migrations
  migrations:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: telegram-mailer-migrations
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mailer-network

  # Admin Bot
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: telegram-mailer-bot
    environment:
      # Database
      DATABASE_URL: ${DATABASE_URL}

      # Redis
      REDIS_URL: ${REDIS_URL}

      # Telegram Bot
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_IDS: ${ADMIN_IDS}

      # Telegram API (needed for session validation)
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}

      # Encryption
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # Storage paths
      SESSIONS_PATH: ${SESSIONS_PATH}
      MEDIA_PATH: ${MEDIA_PATH}

      # Limits
      MAX_ACCOUNTS_PER_USER: ${MAX_ACCOUNTS_PER_USER}
      MAX_PROXIES_PER_USER: ${MAX_PROXIES_PER_USER}
      MAX_FOLDERS_PER_USER: ${MAX_FOLDERS_PER_USER}
      MAX_CAMPAIGNS_PER_USER: ${MAX_CAMPAIGNS_PER_USER}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT}
    volumes:
      - sessions_data:/app/data/sessions
      - media_data:/app/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - mailer-network

  # Worker (can be scaled)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: telegram-mailer-worker
    environment:
      # Database
      DATABASE_URL: ${DATABASE_URL}

      # Redis
      REDIS_URL: ${REDIS_URL}

      # Telegram API (for Telethon)
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}

      # Encryption
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # Storage paths
      SESSIONS_PATH: ${SESSIONS_PATH}
      MEDIA_PATH: ${MEDIA_PATH}

      # Campaign defaults
      DEFAULT_WORK_HOURS: ${DEFAULT_WORK_HOURS}
      DEFAULT_REST_MINUTES: ${DEFAULT_REST_MINUTES}
      DEFAULT_INTERVAL_MIN: ${DEFAULT_INTERVAL_MIN}
      DEFAULT_INTERVAL_MAX: ${DEFAULT_INTERVAL_MAX}

      # 16/8 Cycle
      DEFAULT_USER_WINDOW_START: ${DEFAULT_USER_WINDOW_START}
      USER_WINDOW_HOURS: ${USER_WINDOW_HOURS}
      ADMIN_WINDOW_HOURS: ${ADMIN_WINDOW_HOURS}

      # Worker settings
      WORKER_HEALTH_CHECK_INTERVAL: ${WORKER_HEALTH_CHECK_INTERVAL}
      WORKER_STATS_FLUSH_INTERVAL: ${WORKER_STATS_FLUSH_INTERVAL}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT}
    volumes:
      - sessions_data:/app/data/sessions
      - media_data:/app/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - mailer-network
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  postgres_data:
  redis_data:
  sessions_data:
  media_data:

networks:
  mailer-network:
    driver: bridge
